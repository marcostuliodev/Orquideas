#          fromDatabase:
#            name: orquideas-db
#            property: connectionString
#        - key: NODE_ENV
#          value: production
#        ... (demais secrets iguais)
#    e adicione o bloco:
#      databases:
#        - name: orquideas-db
#          databaseName: orquideas
#          user: orquideas
